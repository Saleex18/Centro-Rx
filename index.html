=>norm(s.name).includes(q)||s.code.includes(q)).slice(0,8);if(!hits.length){listEl.style.display='none';return;}listEl.innerHTML=hits.map(s=>'<div class="ac-item" data-action="pick-student" data-code="'+esc(s.code)+'" data-name="'+esc(s.name)+'"><span>'+esc(s.name)+'</span><span class="code">'+esc(s.code)+'</span></div>').join('');listEl.style.display='block';} function openPayModal(id){const o=db.orders.find(x=>x.id===id);if(!o)return;openModal('<div class="m-head"><h3>Cobrar '+id+' · '+money(o.amount)+' <span class="badge yape">YAPE</span></h3><button class="ibtn" data-action="close-modal">✕</button></div><label style="font-family:\'JetBrains Mono\';font-size:.55rem;letter-spacing:.14em;color:var(--muted);display:block;margin-bottom:6px">CÓDIGO DE PAGO YAPE</label><input class="fi mono yape-in" id="v-yape" placeholder="Ej: YAPE-100600"/><p style="font-size:.7rem;color:var(--muted);margin-top:9px;line-height:1.5">El código es único. Si ya fue usado antes, el sistema bloquea el pago (anti-falsificación).</p><div class="m-actions"><button class="btn btn-ghost" data-action="close-modal">Cancelar</button><button class="btn btn-yape" data-action="confirm-pay" data-id="'+id+'">Confirmar pago YAPE</button></div>');setTimeout(function(){const v=document.getElementById('v-yape');if(v)v.focus();},60);} function confirmPay(id){const o=db.orders.find(x=>x.id===id);if(!o)return;const code=ycode(document.getElementById('v-yape').value);if(!code){toast('Ingrese el código de pago YAPE','warn');return;}const dup=yapeDup(code,id);if(dup){toast('⚠ Código YAPE ya usado en '+dup.id+' · pago duplicado bloqueado','yape');return;}const nowIso=new Date().toISOString();o.payment={status:'paid',paidAt:nowIso,yapeCode:code};o.history.push({ts:nowIso,text:'Pago YAPE validado · cód. '+code,by:'Recepción'});save();closeModal();toast(id+' cobrada por YAPE ✓','yape');render();} function openDetail(id){ const o=db.orders.find(x=>x.id===id);if(!o)return; const st=orderStatus(o),meta=STATUS_META[st]; const rows=MODS.filter(m=>((o.items[m.key]||{}).ordered||0)>0).map(m=>{const it=o.items[m.key],pct=it.ordered?Math.round(it.taken/it.ordered*100):0;return '<div class="mod-row"><span class="dot" style="background:'+m.color+'"></span><div class="mod-info"><div class="mod-name"><span>'+m.name+(m.note?' <em style="font-style:normal;color:var(--muted);font-size:.64rem">'+m.note+'</em>':'')+'</span><span class="mod-count">'+it.taken+'/'+it.ordered+'</span></div><div class="pbar"><i style="width:'+pct+'%;background:'+m.color+'"></i></div></div></div>';}).join(''); const hist=(o.history||[]).slice().reverse().map(h=>'<li><span class="h-time">'+fmtTime(h.ts)+'</span>'+esc(h.text)+'<em>'+esc(h.by||'')+'</em></li>').join(''); openModal('<div class="m-head"><h3><span class="oid">'+o.id+'</span> <span class="badge '+meta.cls+'">'+meta.label+'</span></h3><button class="ibtn" data-action="close-modal">✕</button></div>'+ '<div class="m-grid2"><div class="m-item"><span>PACIENTE</span><b>'+esc(o.patient)+'</b></div><div class="m-item"><span>TRATANTE</span><b>'+esc(o.student?o.student.name:'—')+'</b></div><div class="m-item"><span>CÓDIGO TRATANTE</span><b class="mono">'+esc(o.student?o.student.code:'')+'</b></div><div class="m-item"><span>PAGO</span><b>'+(o.payment.status==='paid'?'✓ YAPE · '+fmtTime(o.payment.paidAt):'Pendiente')+'</b></div><div class="m-item" style="grid-column:1/-1"><span>CÓDIGO DE PAGO YAPE</span><b class="mono" style="color:var(--yape)">'+esc(o.payment.yapeCode||'— sin pago —')+'</b></div></div>'+ '<div class="m-sub">ESTUDIOS · '+takenCount(o)+'/'+orderedCount(o)+' TOMADOS</div>'+rows+ '<div class="total-line" style="margin-top:12px"><span>IMPORTE</span><b>'+money(o.amount)+'</b></div>'+ '<div class="m-sub">HISTORIAL</div><ul class="hist">'+hist+'</ul>'+ '<div class="m-actions">'+(o.payment.status!=='paid'?'<button class="btn btn-yape" data-action="open-pay" data-id="'+o.id+'">Cobrar con YAPE</button>':'')+(st!=='completado'?'<button class="btn btn-danger" data-action="ask-delete" data-id="'+o.id+'">Eliminar</button>':'')+'</div>','lg'); } function openPrices(){openModal('<div class="m-head"><h3>Tarifario (S/)</h3><button class="ibtn" data-action="close-modal">✕</button></div><div class="pr-grid">'+MODS.map(m=>'<div class="pr-box"><label><span class="dot" style="background:'+m.color+'"></span>'+m.name+'</label><input class="fi" type="number" min="0" step="0.5" value="'+db.prices[m.key]+'" id="p-'+m.key+'" style="text-align:center"/></div>').join('')+'</div><p style="font-size:.68rem;color:var(--muted);margin-top:12px">Aplica a nuevas órdenes.</p><div class="m-actions"><button class="btn btn-ghost" data-action="close-modal">Cancelar</button><button class="btn btn-primary" data-action="save-prices">Guardar</button></div>');} function openPadron(){openModal('<div class="m-head"><h3>Padrón <span class="cnt">'+allStudents().length+'</span></h3><button class="ibtn" data-action="close-modal">✕</button></div><div class="search wide" style="margin-bottom:12px">'+icon('search',15)+'<input id="padron-q" placeholder="Buscar nombre o código…"/></div><div id="padron-list"></div>','lg');renderPadron('');} function renderPadron(q){const el=document.getElementById('padron-list');if(!el)return;const nq=norm(q);const list=allStudents().filter(s=>!nq||norm(s.name).includes(nq)||s.code.includes(nq)).slice(0,100);const newCodes=new Set((db.students||[]).map(s=>s.code));el.innerHTML='<div class="padron">'+(list.length?list.map(s=>'<div class="p-row"><span class="code mono">'+esc(s.code)+'</span><span>'+esc(s.name)+'</span>'+(newCodes.has(s.code)?'<span class="badge st-pend" style="margin-left:auto">NUEVO</span>':'')+'</div>').join(''):'<div class="empty" style="padding:18px">Sin coincidencias.</div>')+(list.length>=100?'<div class="p-more">…refine la búsqueda</div>':'')+'</div>';} /* ===== ACCIONES ===== */ function refreshQty(){const g=document.getElementById('qty-grid');if(g)g.innerHTML=qtyGridHTML();const t=document.getElementById('form-total');if(t)t.textContent=money(formTotal());} function resetForm(){MODS.forEach(m=>form.qty[m.key]=0);['f-patient','f-student','f-code','f-yape'].forEach(function(id){const e=document.getElementById(id);if(e)e.value='';});studentHint();refreshQty();} function registerOrder(paid){ const patient=(document.getElementById('f-patient').value||'').trim(); let sName=(document.getElementById('f-student').value||'').trim(); let sCode=(document.getElementById('f-code').value||'').trim(); if(!patient){toast('Falta el paciente','warn');return;} if(!sName||!sCode){toast('Complete tratante y código','warn');return;} const items={};let total=0,ord=0; MODS.forEach(m=>{items[m.key]={ordered:form.qty[m.key],taken:0};total+=form.qty[m.key]*db.prices[m.key];ord+=form.qty[m.key];}); if(!ord){toast('Agregue al menos un estudio con +','warn');return;} let yapeCode=null; if(paid){yapeCode=ycode(document.getElementById('f-yape').value);if(!yapeCode){toast('Ingrese el código de pago YAPE','warn');const y=document.getElementById('f-yape');if(y)y.focus();return;}const dup=yapeDup(yapeCode,null);if(dup){toast('⚠ Código YAPE ya usado en '+dup.id+' · pago duplicado bloqueado','yape');const y=document.getElementById('f-yape');if(y){y.focus();y.select();}return;}} const hit=allStudents().find(s=>s.code===sCode)||allStudents().find(s=>norm(s.name)===norm(sName)); let isNew=false; if(hit){sName=hit.name;sCode=hit.code;}else{db.students=db.students||[];db.students.push({name:sName,code:sCode});isNew=true;} const nowIso=new Date().toISOString();const id='DX-'+String(db.seq).padStart(4,'0');db.seq++; const o={id,patient,student:{name:sName,code:sCode},createdAt:nowIso,amount:total,items,payment:paid?{status:'paid',paidAt:nowIso,yapeCode:yapeCode}:{status:'pending',paidAt:null,yapeCode:null},takenLog:[],completedAt:null,history:[{ts:nowIso,text:'Orden creada · '+money(total)+(paid?'':' (sin pago)'),by:'Recepción'}]}; if(paid)o.history.push({ts:nowIso,text:'Pago YAPE validado · cód. '+yapeCode,by:'Recepción'}); db.orders.push(o);save();toast(id+' registrada'+(paid?' · cobrada por YAPE':' · sin pago'),'ok'); if(isNew)setTimeout(function(){toast('Tratante nuevo añadido al padrón','info');},400); resetForm();render(); } function recordTaken(id,modKey,delta){ const o=db.orders.find(x=>x.id===id);if(!o)return;const it=o.items[modKey];if(!it)return; const next=Math.max(0,Math.min(it.ordered,it.taken+delta)); if(next===it.taken){if(delta>0)toast('Ya se tomó todo lo ordenado','warn');return;} it.taken=next;o.takenLog=o.takenLog||[]; if(delta>0)o.takenLog.push({ts:new Date().toISOString(),mod:modKey}); else{for(let i=o.takenLog.length-1;i>=0;i--){if(o.takenLog[i].mod===modKey){o.takenLog.splice(i,1);break;}}} const mod=MODS.find(m=>m.key===modKey);o.history=o.history||[]; o.history.push({ts:new Date().toISOString(),text:mod.name+' '+it.taken+'/'+it.ordered+(delta>0?'':' (corrección)'),by:'Radiología'}); if(!o.completedAt&&orderedCount(o)>0&&orderedCount(o)===takenCount(o)){o.completedAt=new Date().toISOString();o.history.push({ts:o.completedAt,text:'Orden completada',by:'Radiología'});save();toast(id+' completada ✓','ok');} else{save();toast(mod.name+' '+it.taken+'/'+it.ordered,'ok');} render(); } function askDelete(id){askConfirm('Eliminar '+id,'Se perderá el conteo e historial de esta orden.','Eliminar',function(){db.orders=db.orders.filter(o=>o.id!==id);save();closeModal();toast(id+' eliminada','warn');render();});} function savePrices(){MODS.forEach(m=>{db.prices[m.key]=Math.max(0,parseFloat(document.getElementById('p-'+m.key).value)||0);});save();closeModal();toast('Tarifario actualizado','ok');render();} function exportCSV(){ const todays=db.orders.filter(o=>isToday(o.createdAt)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)); if(!todays.length){toast('Sin registros de hoy','warn');return;} const head=['Orden','Fecha','Hora','Paciente','Tratante','Código'].concat(MODS.flatMap(m=>[m.name+' ord.',m.name+' tomadas'])).concat(['Importe S/','Pago','Código YAPE','Estado']); const rows=todays.map(o=>[o.id,new Date(o.createdAt).toLocaleDateString('es'),fmtTime(o.createdAt),o.patient,o.student?o.student.name:'',o.student?o.student.code:''].concat(MODS.flatMap(m=>[o.items[m.key].ordered,o.items[m.key].taken])).concat([o.amount.toFixed(2),o.payment.status==='paid'?'YAPE':'Pendiente',o.payment.yapeCode||'',STATUS_META[orderStatus(o)].label])); const csv='\uFEFF'+[head].concat(rows).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'); const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='corte_rxdent_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();toast('Corte exportado','ok'); } function toast(msg,type){type=type||'ok';const box=document.createElement('div');box.className='toast t-'+type;box.innerHTML='<span class="td"></span>'+esc(msg);document.getElementById('toasts').appendChild(box);setTimeout(function(){box.classList.add('out');setTimeout(function(){box.remove();},300);},2800);} /* ===== EVENTOS ===== */ document.addEventListener('click',function(e){ const t=e.target.closest('[data-action]'); if(!e.target.closest('.ac')){const l=document.getElementById('ac-list');if(l)l.style.display='none';} if(!t||t.disabled)return; const a=t.dataset.action; if(a==='go')go(t.dataset.view); else if(a==='qplus'){form.qty[t.dataset.mod]=Math.min(30,form.qty[t.dataset.mod]+1);refreshQty();} else if(a==='qminus'){form.qty[t.dataset.mod]=Math.max(0,form.qty[t.dataset.mod]-1);refreshQty();} else if(a==='register')registerOrder(t.dataset.paid==='1'); else if(a==='filter'){state.filter=t.dataset.val;render();} else if(a==='open-detail')openDetail(t.dataset.id); else if(a==='open-pay')openPayModal(t.dataset.id); else if(a==='confirm-pay')confirmPay(t.dataset.id); else if(a==='ask-delete')askDelete(t.dataset.id); else if(a==='take')recordTaken(t.dataset.id,t.dataset.mod,parseInt(t.dataset.delta,10)); else if(a==='open-prices')openPrices(); else if(a==='save-prices')savePrices(); else if(a==='open-padron')openPadron(); else if(a==='pick-student'){const n=document.getElementById('f-student'),c=document.getElementById('f-code');if(n)n.value=t.dataset.name;if(c)c.value=t.dataset.code;const l=document.getElementById('ac-list');if(l)l.style.display='none';studentHint();} else if(a==='export-csv')exportCSV(); else if(a==='close-modal')closeModal(); else if(a==='confirm-yes'){const cb=confirmCb;confirmCb=null;closeModal();if(cb)cb();} }); document.addEventListener('input',function(e){ if(e.target.id==='searchBox'){state.q=e.target.value;const w=document.getElementById('orders-wrap');if(w)w.innerHTML=ordersBlock();return;} if(e.target.id==='tecSearch'){state.tq=e.target.value;const w=document.getElementById('tec-wrap');if(w)w.innerHTML=tecListsHTML();return;} if(e.target.id==='f-student'){showAc();const hit=allStudents().find(s=>norm(s.name)===norm(e.target.value.trim()));const c=document.getElementById('f-code');if(hit&&c&&!c.value)c.value=hit.code;studentHint();return;} if(e.target.id==='f-code'){const hit=allStudents().find(s=>s.code===e.target.value.trim());const n=document.getElementById('f-student');if(hit&&n&&!n.value)n.value=hit.name;studentHint();return;} if(e.target.id==='padron-q'){renderPadron(e.target.value);return;} }); document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();}); window.addEventListener('storage',function(e){if(e.key===LS_KEY){db=load();render();toast('Sincronizado desde otra estación','info');}}); render();
</script>
